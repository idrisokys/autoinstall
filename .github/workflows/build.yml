name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        run: bash build.sh

      - name: Zip'le
        run: |
          cd build
          ditto -c -k --keepParent "elmakurdu.app" elmakurdu-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: elmakurdu-macOS
          path: build/elmakurdu-macOS.zip

      - name: Release oluştur (v* etiketi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/elmakurdu-macOS.zip
          generate_release_notes: true

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Derle (osacompile)
        run: |
          mkdir -p build
          osacompile -o "build/Installer.app" src/Installer.applescript
          cp assets/AppIcon.icns "build/Installer.app/Contents/Resources/applet.icns"
          touch "build/Installer.app"
          xattr -cr "build/Installer.app"
          codesign --force --deep --sign - "build/Installer.app"
          codesign --verify --deep --strict "build/Installer.app"

      - name: Zip'le
        run: |
          cd build
          ditto -c -k --keepParent "Installer.app" Installer-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Installer-macOS
          path: build/Installer-macOS.zip

      - name: Release oluştur (v* etiketi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Installer-macOS.zip
          generate_release_notes: true
